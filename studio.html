<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daniela's Design Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:ital,wght@0,400;0,600;0,800;1,400&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Bebas+Neue&display=swap">
<style>
/* Layout: editor shell — tool rail + slide-out panel on the left, contextual toolbar over a dimmed workspace holding the page. Brand rose/plum carried into the chrome. */
:root{
  --bg:#F7F1F3; --panel:#FFFFFF; --raise:#FBF6F8; --line:#EADCE1; --fg:#2A1820; --muted:#7A626B;
  --accent:#B5536E; --accent-ink:#FFFFFF; --accent-soft:#F6E6EC; --work:#EBE0E4; --danger:#B3261E;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --ui:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 1px 2px rgba(42,24,32,.08), 0 8px 24px rgba(42,24,32,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171013; --panel:#211619; --raise:#2A1C21; --line:#3B2A31; --fg:#F4E8EC; --muted:#B79EA7;
  --accent:#D9829B; --accent-ink:#2A1820; --accent-soft:#3A2028; --work:#0F0A0C; --danger:#F2B8B5;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#171013; --panel:#211619; --raise:#2A1C21; --line:#3B2A31; --fg:#F4E8EC; --muted:#B79EA7;
  --accent:#D9829B; --accent-ink:#2A1820; --accent-soft:#3A2028; --work:#0F0A0C; --danger:#F2B8B5;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45); color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:72px 300px minmax(0,1fr);grid-template-rows:56px 52px minmax(0,1fr);
  grid-template-areas:"top top top" "rail panel tools" "rail panel work"}
.app.panel-closed{grid-template-columns:72px 0 minmax(0,1fr)}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap}
.mark svg{flex:none}
.mark small{font-family:var(--ui);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em}
.sep{width:1px;height:24px;background:var(--line);flex:none}
#docName{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;min-width:0;width:220px;font-weight:600}
#docName:hover{border-color:var(--line)}
#docName:focus{border-color:var(--accent);background:var(--raise);outline:none}
.grow{flex:1}
.ibtn{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--fg)}
.ibtn:hover:not(:disabled){background:var(--accent-soft)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.zoomv{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.primary{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.primary:hover{filter:brightness(1.06)}
.ghost{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.ghost:hover{border-color:var(--accent)}
select.ghost{padding-right:6px;max-width:190px}

/* rail */
.rail{grid-area:rail;display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line)}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:11px;font-weight:500}
.rail button:hover{color:var(--fg);background:var(--raise)}
.rail button.on{color:var(--accent);background:var(--accent-soft)}
.rail svg{width:22px;height:22px}

/* panel */
.panel{grid-area:panel;background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-width:0}
.panel-closed .panel{display:none}
.pane{padding:18px 16px 32px;display:flex;flex-direction:column;gap:18px}
.pane h2{font-family:var(--display);font-size:22px;font-weight:700;margin:0}
.pane h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.pane p.note{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;text-align:left;min-width:0}
.tthumb{width:100%;aspect-ratio:1;border-radius:10px;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.tthumb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 1px 4px rgba(42,24,32,.18)}
.tcard:hover .tthumb{border-color:var(--accent)}
.tcard b{font-size:13px;font-weight:600;line-height:1.25}
.tcard span{font-size:11px;color:var(--muted)}
.sizes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sizes button{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raise);text-align:left;font-size:12px;line-height:1.3}
.sizes button:hover{border-color:var(--accent)}
.sizes small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.tpreset{display:block;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--raise);text-align:left;margin-bottom:8px;color:var(--fg)}
.tpreset:hover{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.egrid button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--raise);display:grid;place-items:center;padding:10px}
.egrid button:hover{border-color:var(--accent)}
.egrid svg{width:100%;height:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 3px var(--panel)}
.swlab{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.swlab div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ugrid button{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--raise)}
.ugrid img{width:100%;height:100%;object-fit:cover;display:block}
.mylist{display:flex;flex-direction:column;gap:10px}
.myrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--raise)}
.myrow.cur{border-color:var(--accent)}
.myrow .th{width:64px;height:64px;border-radius:6px;background:var(--panel);display:grid;place-items:center;overflow:hidden}
.myrow .th img{max-width:100%;max-height:100%}
.myrow .meta{min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0}
.myrow .meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.myrow .meta span{font-size:11px;color:var(--muted)}
.del{border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;color:var(--muted);font-size:12px}
.del:hover{color:var(--danger);border-color:var(--line)}
.del.arm{color:var(--danger);border-color:var(--danger)}
.contact{display:flex;flex-direction:column;gap:6px}
.contact button{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raise);text-align:left}
.contact button:hover{border-color:var(--accent)}
.contact span{color:var(--muted);font-size:12px}
.fontrow{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--raise);display:flex;flex-direction:column;gap:2px}
.fontrow span{font-size:11px;color:var(--muted)}

/* toolbar */
.tools{grid-area:tools;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;min-width:0}
.tg{display:flex;align-items:center;gap:4px;flex:none}
.tg label{font-size:11px;color:var(--muted);margin-right:2px}
.tools select,.tools input[type=number]{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:0 6px}
.tools input[type=number]{width:62px;font-variant-numeric:tabular-nums}
.tools input[type=range]{width:84px;accent-color:var(--accent)}
.cpick{width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;overflow:hidden}
.cpick::-webkit-color-swatch-wrapper{padding:3px}
.cpick::-webkit-color-swatch{border:0;border-radius:5px}
.mini{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);padding:0;flex:none}
.mini:hover{transform:scale(1.15)}
.tools .hint{color:var(--muted);font-size:12px}

/* workspace */
.work{grid-area:work;background:var(--work);overflow:auto;display:flex;position:relative;min-width:0;min-height:0}
#stageWrap{margin:auto;flex:none;position:relative}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#page{position:absolute;inset:0;overflow:hidden;box-shadow:0 2px 6px rgba(42,24,32,.12),0 18px 50px rgba(42,24,32,.18)}
.obj{position:absolute;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
.obj.text{white-space:pre-wrap;overflow-wrap:break-word;cursor:default}
.obj.text[contenteditable]{user-select:text;-webkit-user-select:text;cursor:text;outline:none}
.obj.image{overflow:hidden}
.obj.image img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.obj svg{display:block;pointer-events:none}
.obj:hover:not(.selected){outline:calc(2px * var(--k,1)) solid rgba(181,83,110,.55)}
#selbox{position:absolute;pointer-events:none;box-sizing:border-box;outline:calc(2px * var(--k,1)) solid #B5536E}
#selbox[hidden]{display:none!important}
.h{position:absolute;width:calc(14px * var(--k,1));height:calc(14px * var(--k,1));margin:calc(-7px * var(--k,1)) 0 0 calc(-7px * var(--k,1));
  background:#fff;border:calc(1.5px * var(--k,1)) solid #B5536E;border-radius:50%;pointer-events:auto;touch-action:none;box-sizing:border-box}
.h.side{border-radius:calc(4px * var(--k,1))}
.h[data-h=n],.h[data-h=s]{width:calc(22px * var(--k,1));height:calc(9px * var(--k,1));margin:calc(-4.5px * var(--k,1)) 0 0 calc(-11px * var(--k,1))}
.h[data-h=e],.h[data-h=w]{width:calc(9px * var(--k,1));height:calc(22px * var(--k,1));margin:calc(-11px * var(--k,1)) 0 0 calc(-4.5px * var(--k,1))}
.h[data-h=nw]{left:0;top:0;cursor:nwse-resize}.h[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
.h[data-h=se]{left:100%;top:100%;cursor:nwse-resize}.h[data-h=sw]{left:0;top:100%;cursor:nesw-resize}
.h[data-h=n]{left:50%;top:0;cursor:ns-resize}.h[data-h=s]{left:50%;top:100%;cursor:ns-resize}
.h[data-h=e]{left:100%;top:50%;cursor:ew-resize}.h[data-h=w]{left:0;top:50%;cursor:ew-resize}
.h[data-h=rot]{left:50%;top:calc(100% + 34px * var(--k,1));cursor:grab;width:calc(26px * var(--k,1));height:calc(26px * var(--k,1));margin:calc(-13px * var(--k,1)) 0 0 calc(-13px * var(--k,1));
  display:grid;place-items:center;color:#B5536E}
.h[data-h=rot] svg{width:60%;height:60%}
#selbox.is-text .h[data-h=n],#selbox.is-text .h[data-h=s],#selbox.editing .h{display:none}
.guide{position:absolute;background:#E0457B;pointer-events:none}
.guide.v{width:calc(1px * var(--k,1));top:0;bottom:0}
.guide.hz{height:calc(1px * var(--k,1));left:0;right:0}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(23,16,19,.55);display:grid;place-items:center;z-index:50;padding:16px}
.mcard{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.mcard h2{font-family:var(--display);margin:0;font-size:24px}
.mprev{background:var(--work);border-radius:10px;padding:14px;display:grid;place-items:center;min-height:160px}
.mprev img{max-width:100%;max-height:46vh;box-shadow:var(--shadow)}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width: 760px){
  .app,.app.panel-closed{grid-template-columns:minmax(0,1fr);grid-template-rows:52px 50px minmax(0,1fr) 62px;grid-template-areas:"top" "tools" "work" "rail"}
  .mark small,.mark .wordmark,.top .sep,.zoomgrp,#resizeSel{display:none}
  #docName{width:auto;flex:1}
  .grow{display:none}
  .rail{flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
  .rail button{flex:1;padding:6px 0}
  .panel{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));height:min(56vh,520px);z-index:20;border-right:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow)}
  .primary .lbl{display:none}
  .primary{padding:0 12px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="mark" title="Daniela's Design Studio">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#B5536E" d="M10 2l1.9 6.1L18 10l-6.1 1.9L10 18l-1.9-6.1L2 10l6.1-1.9z"/><path fill="#8E3F57" d="M19 13l.9 2.1 2.1.9-2.1.9L19 19l-.9-2.1L16 16l2.1-.9z"/></svg>
      <span class="wordmark">Design Studio</span><small>DANIELA'S CLEANING CO.</small>
    </div>
    <span class="sep"></span>
    <input id="docName" aria-label="Design name" value="Untitled design">
    <select id="resizeSel" class="ghost" aria-label="Resize design"></select>
    <span class="grow"></span>
    <button class="ibtn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62A7.95 7.95 0 0 1 12.5 10.5c3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></button>
    <button class="ibtn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M18.4 10.6C16.55 9 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22l2.36.78A8 8 0 0 1 11.5 10.5c1.95 0 3.73.72 5.12 1.88L13 16h9V7z"/></svg></button>
    <span class="sep"></span>
    <span class="tg zoomgrp">
      <button class="ibtn" id="zoomOut" aria-label="Zoom out">−</button>
      <span class="zoomv" id="zoomVal">100%</span>
      <button class="ibtn" id="zoomIn" aria-label="Zoom in">+</button>
      <button class="ibtn" id="zoomFit" title="Fit to screen">Fit</button>
    </span>
    <button class="primary" id="exportBtn"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg><span class="lbl">Download</span></button>
  </header>

  <nav class="rail" aria-label="Tools">
    <button data-tab="templates" class="on"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v5h-8zm2 2v1h4V5zM3 13h8v8H3zm2 2v4h4v-4zm8-5h8v11h-8zm2 2v7h4v-7z"/></svg>Designs</button>
    <button data-tab="text"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 4v3h5.5v12h3V7H19V4z"/></svg>Text</button>
    <button data-tab="elements"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 2 5.5 11h11zm0 3.84L12.93 9h-3.87zM17.5 13a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm0 7a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zM3 21.5h8v-8H3zm2-6h4v4H5z"/></svg>Elements</button>
    <button data-tab="uploads"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13v6H5v-6H3v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6zM11 6.83V16h2V6.83l3.59 3.58L18 9l-6-6-6 6 1.41 1.41z"/></svg>Photos</button>
    <button data-tab="brand"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16a5 5 0 0 0 5-5c0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>Brand</button>
    <button data-tab="mine"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8zm10 14H4V8h16z"/></svg>Saved</button>
  </nav>

  <aside class="panel" id="panel"></aside>
  <div class="tools" id="tools" role="toolbar" aria-label="Selection options"></div>
  <main class="work" id="work">
    <div id="stageWrap"><div id="stage">
      <div id="page"></div>
      <div id="selbox" hidden>
        <div class="h" data-h="nw"></div><div class="h" data-h="ne"></div><div class="h" data-h="se"></div><div class="h" data-h="sw"></div>
        <div class="h side" data-h="n"></div><div class="h side" data-h="s"></div><div class="h side" data-h="e"></div><div class="h side" data-h="w"></div>
        <div class="h" data-h="rot" title="Rotate"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></div>
      </div>
      <div class="guide v" id="gv" hidden></div><div class="guide hz" id="gh" hidden></div>
    </div></div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="mcard" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Download your design</h2>
    <div class="mrow">

function wrapText(ctx,text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){
    const words=para.split(' '); let line='';
    for(const w of words){ const test=line?line+' '+w:w; if(line && ctx.measureText(test).width>maxW+0.5){ out.push(line); line=w; } else line=test; }
    out.push(line);
  }
  return out;
}
const visible = c => c && c!=='transparent';
async function drawObj(ctx,o){
  ctx.save(); ctx.globalAlpha=o.opacity??1;
  let h=o.h, lines;
  if(o.type==='text'){ ctx.font=fontStr(o); if('letterSpacing' in ctx) ctx.letterSpacing=(o.ls||0)+'px'; lines=wrapText(ctx,o.text,o.w); h=lines.length*o.size*o.lh; }
  ctx.translate(o.x+o.w/2,o.y+h/2); ctx.rotate((o.rot||0)*Math.PI/180); ctx.translate(-o.w/2,-h/2);
  if(o.type==='rect'){
    if(visible(o.fill)){ rr(ctx,0,0,o.w,o.h,o.radius||0); ctx.fillStyle=o.fill; ctx.fill(); }
    if(o.sw>0){ rr(ctx,o.sw/2,o.sw/2,o.w-o.sw,o.h-o.sw,Math.max(0,(o.radius||0)-o.sw/2)); ctx.lineWidth=o.sw; ctx.strokeStyle=o.stroke; ctx.stroke(); }
  } else if(o.type==='ellipse'){
    if(visible(o.fill)){ ctx.beginPath(); ctx.ellipse(o.w/2,o.h/2,o.w/2,o.h/2,0,0,Math.PI*2); ctx.fillStyle=o.fill; ctx.fill(); }
    if(o.sw>0){ ctx.beginPath(); ctx.ellipse(o.w/2,o.h/2,Math.max(0,o.w/2-o.sw/2),Math.max(0,o.h/2-o.sw/2),0,0,Math.PI*2); ctx.lineWidth=o.sw; ctx.strokeStyle=o.stroke; ctx.stroke(); }
  } else if(o.type==='icon'){
    ctx.scale(o.w/24,o.h/24); ctx.fillStyle=o.fill; ctx.fill(new Path2D(ICONS[o.icon]), EVENODD.has(o.icon)?'evenodd':'nonzero');
  } else if(o.type==='image'){
    const im=await loadImg(o.src);
    if(im){ const k=Math.max(o.w/im.width,o.h/im.height), sw=o.w/k, sh=o.h/k; rr(ctx,0,0,o.w,o.h,o.radius||0); ctx.clip(); ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,o.w,o.h); }
  } else if(o.type==='text'){
    ctx.fillStyle=o.color; ctx.textBaseline='middle'; ctx.textAlign=o.align;
    const ax=o.align==='center'?o.w/2:o.align==='right'?o.w:0, lhp=o.size*o.lh;
    lines.forEach((l,i)=>ctx.fillText(l,ax,i*lhp+lhp/2));
  }
  ctx.restore();
}
async function renderDoc(d, scale){
  await ensureFonts(d);
  const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(d.w*scale)); cv.height=Math.max(1,Math.round(d.h*scale));
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  ctx.fillStyle=d.bg; ctx.fillRect(0,0,d.w,d.h);
  for(const o of d.objects) await drawObj(ctx,o);
  return cv;
}
const thumbOf = async (d, px=240) => (await renderDoc(d, px/Math.max(d.w,d.h))).toDataURL('image/jpeg',.82);

let exp={s:1,f:'png'}, lastUrl=null;
async function openExport(){ if(editing) endEdit(); $('#modal').hidden=false; await refreshExport(); }
async function refreshExport(){
  $('#mPrev').textContent='Rendering…';
  const cv=await renderDoc(doc, exp.s);
  const blob=await new Promise(r=>cv.toBlob(r, 'image/'+exp.f, .92));
  if(lastUrl) URL.revokeObjectURL(lastUrl); lastUrl=URL.createObjectURL(blob);
  const im=new Image(); im.src=lastUrl; im.alt='Preview of your design'; $('#mPrev').replaceChildren(im);
  const name=(doc.name||'design').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()||'design';
  const a=$('#dlLink'); a.href=lastUrl; a.download=`${name}.${exp.f==='jpeg'?'jpg':'png'}`;
  $('#mInfo').textContent=`${cv.width} × ${cv.height} px · ${(blob.size/1024/1024).toFixed(2)} MB. If the Save button doesn't start a download here, right-click the preview (or press and hold on a phone) and choose Save image.`;
}
function closeModal(){ $('#modal').hidden=true; }
$('#exportBtn').onclick=openExport; $('#mClose').onclick=closeModal;
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
$('#scaleSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; exp.s=+b.dataset.s; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); refreshExport(); };
$('#fmtSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; exp.f=b.dataset.f; [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); refreshExport(); };

/* ---------- logo (rendered once as an image) ---------- */
async function makeLogo(light){
  await Promise.all([document.fonts.load('700 100px "Playfair Display"'),document.fonts.load('600 40px "DM Sans"')]).catch(()=>{});
  const cv=document.createElement('canvas'); cv.width=1300; cv.height=420; const ctx=cv.getContext('2d');
  ctx.save(); ctx.translate(20,60); ctx.scale(300/24,300/24); ctx.fillStyle=light?'#FFFFFF':C.rose; ctx.fill(new Path2D(ICONS.sparkles)); ctx.restore();
  ctx.fillStyle=light?'#FFFFFF':C.ink; ctx.font='700 170px "Playfair Display", Georgia, serif'; ctx.textBaseline='alphabetic'; ctx.fillText("Daniela's",340,235);
  ctx.fillStyle=light?C.blush:C.rose; ctx.font='600 58px "DM Sans", sans-serif'; if('letterSpacing' in ctx) ctx.letterSpacing='18px'; ctx.fillText('CLEANING CO.',348,335);
  return {src:cv.toDataURL('image/png'), w:cv.width, h:cv.height};
}

/* ---------- panels ---------- */
let curTab='templates';
const tplThumbs = new Map();

      <div><h3>Start blank</h3><div class="sizes">${SIZES.map(([n,w,h_,sub],i)=>`<button data-blank="${i}">${n}<small>${sub}</small></button>`).join('')}</div></div>
    </div>`;
  } else if(curTab==='text'){
    h=`<div class="pane"><h2>Text</h2><div>${TEXT_PRESETS.map(([t,p,css],i)=>`<button class="tpreset" data-tp="${i}" style="${css}">${t}</button>`).join('')}</div>
      <div><h3>Your phrases</h3><div class="chips">${PHRASES.map((p,i)=>`<button class="chip" data-ph="${i}">${p}</button>`).join('')}</div></div>
      <p class="note">Double-click any text on the page to change the words. Drag a corner to make it bigger; drag a side to change where lines wrap.</p></div>`;
  } else if(curTab==='elements'){
    const shapes=[['rect','<rect x="3" y="3" width="18" height="18" fill="#B5536E"/>'],['rounded','<rect x="3" y="3" width="18" height="18" rx="4" fill="#E6D0D8"/>'],['circle','<circle cx="12" cy="12" r="9" fill="#B5536E"/>'],['pill','<rect x="2" y="8" width="20" height="8" rx="4" fill="#B5536E"/>'],['line','<rect x="2" y="11" width="20" height="2" fill="#8E3F57"/>'],['outline','<rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#B5536E" stroke-width="2"/>'],['ring','<circle cx="12" cy="12" r="8" fill="none" stroke="#B5536E" stroke-width="2.5"/>'],['arch','<rect x="6" y="2" width="12" height="20" rx="6" fill="#E6D0D8"/>']];
    h=`<div class="pane"><h2>Elements</h2><div><h3>Shapes</h3><div class="egrid">${shapes.map(([k,s])=>`<button data-shape="${k}" aria-label="${k}"><svg viewBox="0 0 24 24">${s}</svg></button>`).join('')}</div></div>
      <div><h3>Icons</h3><div class="egrid">${Object.keys(ICONS).map(k=>`<button data-icon="${k}" aria-label="${k}" title="${k}"><svg viewBox="0 0 24 24"><path fill="#B5536E" fill-rule="${EVENODD.has(k)?'evenodd':'nonzero'}" d="${ICONS[k]}"/></svg></button>`).join('')}</div></div></div>`;
  } else if(curTab==='uploads'){
    h=`<div class="pane"><h2>Photos</h2><div class="drop" id="drop"><span>Drop photos of your work here, or</span><button class="primary" id="upBtn">Upload photos</button><span style="font-size:12px">Before-and-afters, your team, your logo. Photos stay in this browser only.</span></div>
      ${uploads.length?`<div><h3>Your photos</h3><div class="ugrid">${uploads.map((u,i)=>`<button data-up="${i}" aria-label="Add photo ${i+1}"><img alt="" src="${u.src}"></button>`).join('')}</div></div>`:'<p class="note">No photos yet. Anything you upload will show up here so you can reuse it.</p>'}</div>`;
  } else if(curTab==='brand'){
    h=`<div class="pane"><h2>Brand kit</h2>
      <div><h3>Logo</h3><div class="tgrid"><button class="tcard" data-logo="dark"><div class="tthumb" style="background:#FAF5F7"><img alt="" data-logoimg="dark"></div><b>On light</b></button><button class="tcard" data-logo="light"><div class="tthumb" style="background:#8E3F57"><img alt="" data-logoimg="light"></div><b>On dark</b></button></div></div>
      <div><h3>Colours</h3><div class="swlab">${BRAND_COLORS.map(([n,c])=>`<div><button class="sw" data-bc="${c}" style="background:${c}" aria-label="${n}"></button>${n}</div>`).join('')}</div><p class="note" style="margin-top:8px">Tap a colour to apply it to whatever is selected, or to the page background when nothing is.</p></div>
      <div><h3>Fonts</h3><div style="display:flex;flex-direction:column;gap:8px">
        <button class="fontrow" data-tp="0" style="text-align:left;font-family:var(--display);font-size:22px;font-weight:700">Playfair Display<span style="font-family:var(--ui)">Headings</span></button>
        <button class="fontrow" data-tp="2" style="text-align:left;font-size:17px">DM Sans<span>Body text and labels</span></button>
        <button class="fontrow" data-tp="3" style="text-align:left;font-family:'Great Vibes',cursive;font-size:26px">Great Vibes<span style="font-family:var(--ui)">Script accent, use sparingly</span></button></div></div>
      <div><h3>Contact details</h3><div class="contact">
        <button data-ct="${PHONE}">${PHONE}<span>Phone / text</span></button>
        <button data-ct="Westlock, Alberta">Westlock, Alberta<span>Location</span></button>
        <button data-ct="Westlock · Barrhead · Athabasca · Morinville">Service towns<span>4 towns</span></button>
        <button data-ct="Cash or e-transfer accepted">Payment<span>Cash / e-transfer</span></button>
      </div></div>
      <div><h3>Services & prices</h3><div class="contact">${services.map(([n,p])=>`<button data-ct="${n} · ${p}">${n}<span>${p}</span></button>`).join('')}</div></div>
    </div>`;
  } else if(curTab==='mine'){
    const list=store.get('dstudio.designs',[]).sort((a,b)=>b.updated-a.updated);
    h=`<div class="pane"><h2>Saved designs</h2><p class="note">Every change saves automatically in this browser.</p>
      ${list.length?`<div class="mylist">${list.map(d=>`<div class="myrow ${d.id===designId?'cur':''}"><div class="th">${d.thumb?`<img alt="" src="${d.thumb}">`:''}</div><button class="meta" data-open="${d.id}"><b>${esc(d.doc.name)}</b><span>${d.doc.w} × ${d.doc.h} · ${new Date(d.updated).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></button><button class="del" data-del="${d.id}">Delete</button></div>`).join('')}</div>`
      :'<p class="note">Nothing saved yet. Pick a design, make a change, and it will appear here.</p>'}</div>`;
  }
  panel.innerHTML=h;
  if(curTab==='templates') fillTemplateThumbs();
  if(curTab==='brand') ['dark','light'].forEach(async v=>{ const l=await logoP[v](); const im=panel.querySelector(`[data-logoimg="${v}"]`); if(im) im.src=l.src; });
  if(curTab==='uploads'){ const dz=$('#drop'); $('#upBtn').onclick=()=>$('#fileIn').click();
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');}); dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
    dz.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('over');handleFiles([...e.dataTransfer.files]);}); }
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const once = f => { let p; return () => p || (p=f()); };
const logoP = { dark: once(()=>makeLogo(false)), light: once(()=>makeLogo(true)) };
async function fillTemplateThumbs(){
  for(let i=0;i<TEMPLATES.length;i++){
    if(!tplThumbs.has(i)) tplThumbs.set(i, await thumbOf(TEMPLATES[i](), 360));
    const im=panel.querySelector(`[data-tthumb="${i}"]`); if(im && !im.src) im.src=tplThumbs.get(i);
  }
}
panel.addEventListener('click', async e => {
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.tpl) openDoc(TEMPLATES[+d.tpl]());
  else if(d.blank){ const [n,w,h]=SIZES[+d.blank]; openDoc(D(n,w,h,C.white,[])); }
  else if(d.tp){ const [t,p]=TEXT_PRESETS[+d.tp]; addText(t==='SMALL LABEL'?'SMALL LABEL':t.replace('Add a ','').replace('Add ','').replace(/^./,c=>c.toUpperCase()),p); }
  else if(d.ph) { const t=PHRASES[+d.ph]; addText(t, t.length<26?{font:'Playfair Display',size:72,weight:700}:{size:44}); }
  else if(d.ct) addText(d.ct,{size:36,color:C.cocoa});
  else if(d.shape) addShape(d.shape);
  else if(d.icon) addIcon(d.icon);
  else if(d.up) placeImage(uploads[+d.up]);
  else if(d.logo){ const l=await logoP[d.logo](); const w=Math.round(Math.min(doc.w*.6,700)); addObj({type:'image',src:l.src,x:0,y:0,w,h:Math.round(w*l.h/l.w),radius:0,rot:0,opacity:1}); }
  else if(d.bc){ const o=sel&&get(sel); if(!o) setProp('bg',d.bc); else setProp(o.type==='text'?'color':o.type==='image'?'opacity':'fill', o.type==='image'?o.opacity:d.bc, 'bc'+uid()); renderTools(); }
  else if(d.open){ const r=store.get('dstudio.designs',[]).find(x=>x.id===d.open); if(r) openDoc(r.doc, r.id); }
  else if(d.del){ if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='Confirm'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('arm'); b.textContent='Delete'; } },3000); return; }
    store.set('dstudio.designs', store.get('dstudio.designs',[]).filter(x=>x.id!==d.del)); if(d.del===designId) designId=uid(); renderPanel(); toast('Design deleted'); }
});
document.querySelector('.rail').addEventListener('click', e => {
  const b=e.target.closest('button'); if(!b) return; const t=b.dataset.tab;
  const closed=app.classList.contains('panel-closed');
  if(t===curTab && !closed){ app.classList.add('panel-closed'); b.classList.remove('on'); }
  else { curTab=t; app.classList.remove('panel-closed'); document.querySelectorAll('.rail button').forEach(x=>x.classList.toggle('on',x===b)); renderPanel(); }
  requestAnimationFrame(layoutStage);
});
function closePanelOnMobile(){ if(window.innerWidth<=760){ app.classList.add('panel-closed'); document.querySelectorAll('.rail button').forEach(x=>x.classList.remove('on')); } }

/* ---------- open / save / resize ---------- */
function openDoc(d, id){
  if(editing) endEdit();
  doc=JSON.parse(JSON.stringify(d)); doc.objects.forEach(o=>{ if(!o.id) o.id=uid(); });
  designId=id||uid(); sel=null; past=[]; future=[]; fitMode=true;
  store.set('dstudio.last', designId);
  layoutStage(); renderAll(); changed(); if(!id) clearTimeout(saveT);
  ensureFonts(doc).then(()=>{ doc.objects.forEach(o=>measure(o)); renderSel(); });
  closePanelOnMobile();
}
let saveT, warned=false;
function scheduleSave(){ clearTimeout(saveT); saveT=setTimeout(save, 700); }
async function save(){
  if(!doc) return;
  const thumb=await thumbOf(doc, 160).catch(()=>null);
  const list=store.get('dstudio.designs',[]); const i=list.findIndex(x=>x.id===designId);
  const rec={id:designId, updated:Date.now(), thumb, doc};
  if(i>=0) list[i]=rec; else list.push(rec);
  if(!store.set('dstudio.designs', list)){ if(!warned){ toast('Browser storage is full. Delete an old design or use smaller photos.'); warned=true; } }
  else store.set('dstudio.last', designId);
  if(curTab==='mine' && !app.classList.contains('panel-closed')) renderPanel();
}
function renderResize(){
  const s=$('#resizeSel'); const cur=SIZES.findIndex(([,w,h])=>w===doc.w&&h===doc.h);
  s.innerHTML=`<option value="">Resize · ${doc.w} × ${doc.h}</option>`+SIZES.map(([n,w,h],i)=>`<option value="${i}" ${i===cur?'disabled':''}>${n} (${w}×${h})</option>`).join('');
}
$('#resizeSel').addEventListener('change', e => {
  const v=e.target.value; if(v==='') return; const [,W,H]=SIZES[+v];
  const sx=W/doc.w, sy=H/doc.h, k=Math.min(sx,sy);
  mutate(null,()=>{ doc.objects.forEach(o=>{ const cx=(o.x+o.w/2)*sx, cy=(o.y+o.h/2)*sy; o.w=Math.round(o.w*k); o.h=Math.round(o.h*k); if(o.type==='text'){ o.size=Math.round(o.size*k*10)/10; o.ls=(o.ls||0)*k; } if(o.radius) o.radius=Math.round(o.radius*k); if(o.sw) o.sw=Math.max(1,Math.round(o.sw*k)); o.x=Math.round(cx-o.w/2); o.y=Math.round(cy-o.h/2); }); doc.w=W; doc.h=H; });
  fitMode=true; layoutStage(); renderAll(); toast('Resized. Check the layout and nudge anything that moved.');
});
$('#docName').addEventListener('input', e => { mutate('name',()=>{ doc.name=e.target.value||'Untitled design'; }); });
$('#undoBtn').onclick=undo; $('#redoBtn').onclick=redo;
$('#zoomIn').onclick=()=>setZoom(zoom*1.2); $('#zoomOut').onclick=()=>setZoom(zoom/1.2); $('#zoomFit').onclick=()=>{ fitMode=true; layoutStage(); };
work.addEventListener('wheel', e => { if(e.ctrlKey||e.metaKey){ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.1:1/1.1)); } }, {passive:false});
window.addEventListener('resize', () => { if(fitMode) layoutStage(); });

/* ---------- boot ---------- */
const last=store.get('dstudio.last',null), saved=store.get('dstudio.designs',[]).find(x=>x.id===last);
if(saved) openDoc(saved.doc, saved.id); else openDoc(TEMPLATES[0]());
if(window.innerWidth<=760) app.classList.add('panel-closed'), document.querySelectorAll('.rail button').forEach(x=>x.classList.remove('on'));
renderPanel();
document.fonts.ready.then(()=>{ doc.objects.forEach(o=>measure(o)); renderSel(); });
})();
